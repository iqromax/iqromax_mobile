name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/iqromax_mobile
            git fetch origin main
            git reset --hard origin/main
            
            # Install and setup Backend
            cd backend
            npm install
            npx prisma generate
            npx prisma db push
            
            # Build Admin Panel / Web Frontend
            if [ -d "iqromax-web-frontend" ]; then
              cd iqromax-web-frontend
              npm install
              npm run build
              cd ..
            elif [ -d "admin_panel" ]; then
              cd admin_panel
              npm install
              npm run build
              cd ..
            fi
            
            # Restart backend server
            pm2 restart all
